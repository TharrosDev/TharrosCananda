name: Update visual baselines

# Run after an approved visual change: manually, or by pushing a commit whose message contains
# [update-baselines]. Regenerates the Linux screenshots CI compares against and commits them to that
# branch, so the new baselines are reviewed in the pull request diff.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]

permissions:
  contents: write
  actions: write # to dispatch CI on the bot commit

concurrency:
  # Per event: a skipped push run must not cancel a manual dispatch on the same branch.
  group: baselines-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[update-baselines]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Next's build cache makes the production build Playwright starts much faster on repeat runs.
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npx playwright test e2e/visual.spec.ts --update-snapshots
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add e2e/visual.spec.ts-snapshots
          git diff --cached --quiet || git commit -m "test: update visual baselines"
          git pull --rebase
          git push
      # GITHUB_TOKEN pushes do not trigger CI, so start it on the new commit here instead of by hand.
      - run: gh workflow run ci.yml --ref "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
